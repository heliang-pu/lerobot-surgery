[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot-surgery"
version = "0.1.0"
description = "Operations on LeRobot v2.1 datasets that lerobot does not offer: check, inspect, drop, split, merge, trim, retime."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "pyarrow"]

[project.optional-dependencies]
video = ["av"]            # check --videos, retime (retime also needs the ffmpeg binary)
test = ["pytest", "av"]

[project.scripts]
lerobot-surgery = "lerobot_surgery.cli:main"

[tool.setuptools]
packages = ["lerobot_surgery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint.isort]
force-single-line = true
force-sort-within-sections = true
